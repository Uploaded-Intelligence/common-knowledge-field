name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical state
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AGENTS.md
            docs/WINNING.md
            docs/PROGRESS.md
            docs/DECISIONS.md
            docs/RISKS.md
            docs/ARCHITECTURE.md
            docs/ROADMAP.md
            docs/RUNBOOK.md
            docs/REVIEW.md
            docs/RESEARCH_MAP.md
            docs/THREAT_MODEL.md
          )
          for file in "${required[@]}"; do
            test -s "$file"
          done
          if rg -n '\b(TBD|TODO|FIXME)\b' "${required[@]}"; then
            echo 'Canonical state contains placeholders.' >&2
            exit 1
          fi

  application:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Detect application workspace
        id: application
        shell: bash
        run: |
          if test -f package.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Application workspace not yet present; control-plane-only verification applies."
          fi
      - uses: pnpm/action-setup@v4
        if: steps.application.outputs.present == 'true'
        with:
          run_install: false
      - uses: actions/setup-node@v7
        if: steps.application.outputs.present == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.application.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.application.outputs.present == 'true'
        run: pnpm verify
